services:
  translation-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-M2M100 Translation Service}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_NAME: ${MODEL_NAME:-facebook/m2m100_418M}
      MODEL_CACHE_DIR: /models
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_LOCAL_FILES_ONLY: ${MODEL_LOCAL_FILES_ONLY:-false}
      MODEL_MAX_INPUT_TOKENS: ${MODEL_MAX_INPUT_TOKENS:-512}
      MODEL_MAX_NEW_TOKENS: ${MODEL_MAX_NEW_TOKENS:-512}
      MODEL_NUM_BEAMS: ${MODEL_NUM_BEAMS:-4}
      API_MAX_TEXT_CHARACTERS: ${API_MAX_TEXT_CHARACTERS:-10000}
      TRANSLATION_MAX_CONCURRENCY: ${TRANSLATION_MAX_CONCURRENCY:-1}
      LONG_TEXT_CHUNKING_ENABLED: ${LONG_TEXT_CHUNKING_ENABLED:-true}
      LONG_TEXT_CHUNK_MAX_TOKENS: ${LONG_TEXT_CHUNK_MAX_TOKENS:-400}
      LONG_TEXT_MAX_CHUNKS: ${LONG_TEXT_MAX_CHUNKS:-64}
      LANGUAGE_DETECTION_MIN_CONFIDENCE: ${LANGUAGE_DETECTION_MIN_CONFIDENCE:-0.30}
      LANGUAGE_DETECTION_MIN_RELATIVE_DISTANCE: ${LANGUAGE_DETECTION_MIN_RELATIVE_DISTANCE:-0.05}
      LANGUAGE_DETECTION_MIN_ALPHABETIC_CHARACTERS: ${LANGUAGE_DETECTION_MIN_ALPHABETIC_CHARACTERS:-3}
      LANGUAGE_DETECTION_MAX_CANDIDATES: ${LANGUAGE_DETECTION_MAX_CANDIDATES:-3}
    volumes:
      - model-cache:/models
    restart: unless-stopped
    init: true
    stop_grace_period: 2m

volumes:
  model-cache:
