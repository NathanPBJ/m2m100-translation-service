[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m2m100-translation-service"
version = "0.1.0"
description = "Local multilingual translation API built with FastAPI and M2M100."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "NathanPBJ" },
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.7,<3.0",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.5,<3.0",
    "transformers>=4.46,<5.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
